<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151827" />
    <meta
      name="description"
      content="BIFROST Mobile verifies LLM answers on your phone with deterministic APPROVED, REVIEW, and REJECTED verdicts."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/app.css" />
    <title>BIFROST Mobile</title>
  </head>
  <body>
    <div id="app">
      <main class="shell" aria-label="BIFROST mobile verifier">
        <header class="topbar">
          <div>
            <span class="eyebrow">BIFROST MOBILE</span>
            <h1>Verify the answer before it becomes the decision.</h1>
          </div>
          <div class="signal-pill" id="installState">LOCAL</div>
        </header>

        <section class="verdict-card" id="verdictCard" data-state="idle">
          <span class="eyebrow">VERDICT</span>
          <strong id="verdictLabel">READY</strong>
          <p id="verdictHeadline">Paste an LLM answer or share one into BIFROST from your phone.</p>
          <div class="confidence-row">
            <span id="confidenceText">No run yet</span>
            <i><b id="confidenceBar"></b></i>
          </div>
        </section>

        <section class="input-card">
          <label for="promptInput">Prompt / context <span>optional</span></label>
          <textarea
            id="promptInput"
            rows="3"
            placeholder="What did you ask the model? Current/latest prompts help BIFROST catch stale or unsourced claims."
          ></textarea>

          <label for="answerInput">Model answer <span>required</span></label>
          <textarea
            id="answerInput"
            rows="9"
            placeholder="Paste the answer here. On mobile, use Share → BIFROST when available."
          ></textarea>

          <div class="button-row">
            <button id="verifyButton" type="button">Verify Answer</button>
            <button id="clearButton" type="button" class="ghost">Clear</button>
          </div>
        </section>

        <section class="sample-card" aria-label="Sample packets">
          <span class="eyebrow">TRY</span>
          <div class="sample-grid">
            <button type="button" data-sample="finance">Finance numbers</button>
            <button type="button" data-sample="code">Unsafe code</button>
            <button type="button" data-sample="clean">Clean answer</button>
          </div>
        </section>

        <section class="result-card" id="resultCard" hidden>
          <div class="card-head">
            <span class="eyebrow">WHY</span>
            <strong id="descriptorLabel"></strong>
          </div>
          <p id="descriptorDetail"></p>
          <p class="action-line" id="descriptorAction"></p>
          <div id="findingList" class="finding-list"></div>
        </section>

        <section class="receipt-card" id="receiptCard" hidden>
          <div class="card-head">
            <span class="eyebrow">RECEIPT</span>
            <strong id="receiptHash"></strong>
          </div>
          <dl class="receipt-grid">
            <div>
              <dt>Input hash</dt>
              <dd id="inputHashText"></dd>
            </div>
            <div>
              <dt>Corpus</dt>
              <dd>COSMIC-lite v0.1.0</dd>
            </div>
            <div>
              <dt>Runtime</dt>
              <dd>0 LLM calls</dd>
            </div>
            <div>
              <dt>Verdict</dt>
              <dd id="verdictText"></dd>
            </div>
            <div>
              <dt>Latency</dt>
              <dd id="latencyText"></dd>
            </div>
            <div>
              <dt>When</dt>
              <dd id="timestampText"></dd>
            </div>
          </dl>
          <div class="button-row">
            <button id="copyReceiptButton" type="button" class="secondary">Copy Receipt</button>
            <button id="exportReceiptButton" type="button" class="ghost">Export JSON</button>
          </div>
        </section>

        <section class="recent-card" id="recentCard" hidden>
          <span class="eyebrow">RECENT</span>
          <ol id="recentList"></ol>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
